name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's release CDN, which serves Gradle itself, sometimes answers
      # 504. Fetch the wrapper's Gradle with retries before building.
      - name: Download Gradle
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying"; sleep $((i * 15))
          done
          exit 1
      - name: Unit tests
        run: ./gradlew --no-configuration-cache :core:signal:test testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-note-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  web:
    name: Teacher dashboard check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  database:
    name: Database migrations and security-rule tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh
