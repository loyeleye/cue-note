name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's release CDN, which serves Gradle itself, sometimes answers
      # 504. Fetch the wrapper's Gradle with retries before building.
      - name: Download Gradle
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying"; sleep $((i * 15))
          done
          exit 1
      # The pipeline tests run the real Silero voice detector, so build
      # whisper.cpp for the runner and fetch the small model files (cached).
      - name: Build the native speech library for the runner
        run: core/ml/host-build.sh
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/cuenote-models
          key: cuenote-models-silero-v5.1.2-tiny.en
      - name: Download speech models
        run: |
          mkdir -p ~/cuenote-models && cd ~/cuenote-models
          get() { [ -f "$1" ] || curl -fsSL --retry 4 -o "$1" "$2"; }
          get ggml-silero-v5.1.2.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          get ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Unit tests and the golden set
        env:
          CUENOTE_MODELS: /home/runner/cuenote-models
        run: ./gradlew --no-configuration-cache :core:signal:test :core:ml:test :core:pipeline:test testDebugUnitTest
      - name: Golden-set report
        if: always()
        run: cat core/pipeline/build/golden-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
      # One fixed signing key, so each APK installs over the last without
      # wiping the phone's lessons. Absent (e.g. on forks), the build falls
      # back to a throwaway debug key.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cuenote.jks"
            echo "CUENOTE_KEYSTORE=$RUNNER_TEMP/cuenote.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this APK can't update an installed one"
          fi
      - name: Build debug APK
        env:
          CUENOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUENOTE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-configuration-cache assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-note-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # Every build of main becomes a GitHub Release. Obtainium on the phone
      # watches the releases and installs each new one.
      - name: Publish a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CUENOTE_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/cue-note-$VERSION.apk"
          gh release create "v$VERSION" "$RUNNER_TEMP/cue-note-$VERSION.apk" \
            --title "Cue Note $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

  web:
    name: Teacher dashboard check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  functions:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: extract-cues (prompt, schema and answer checks; no model calls)
        run: node --experimental-strip-types --test supabase/functions/extract-cues/cues.test.ts
      - name: extract-cues end to end (fake database and model)
        run: >
          node --experimental-strip-types --import ./supabase/functions/extract-cues/test/loader.mjs
          --test supabase/functions/extract-cues/test/index.test.ts

  database:
    name: Database migrations and security-rule tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh
