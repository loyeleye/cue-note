<text x="322" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#2d2a32">you</text>
<text x="180" y="230" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2d2a32">One phrase, shaped toward its peak</text>
