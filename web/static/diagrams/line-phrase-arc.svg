<path d="M84,128 L140,96" stroke="#2d2a32" stroke-width="1.4" fill="none" marker-end="url(#aI)"/>
<text x="70" y="120" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">build</text>
<path d="M286,92 L316,132" stroke="#2d2a32" stroke-width="1.4" fill="none" marker-end="url(#aI)"/>
