<path d="M306.0,96.0 L308.0,89.7 L310.0,88.2 L312.0,92.5 L314.0,99.5 L316.0,103.8 L318.0,102.3 L320.0,96.0 L322.0,89.7 L324.0,88.2 L326.0,92.5 L328.0,99.5 L330.0,103.8 L332.0,102.3 L334.0,96.0 L336.0,89.7 L338.0,88.2 L340.0,92.5 L342.0,99.5 L344.0,103.8 L346.0,102.3 L348.0,96.0 L350.0,89.7 L352.0,88.2" stroke="#2d2a32" stroke-width="1.8" fill="none"/>
<text x="270" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">Sing</text>
<text x="270" y="186" text-anchor="middle" font-size="11" font-weight="400" fill="#2d2a32">“ah”, already in place</text>
<path d="M150,96 L210,96" stroke="#2d2a32" stroke-width="1.4" fill="none" marker-end="url(#aI)"/>
