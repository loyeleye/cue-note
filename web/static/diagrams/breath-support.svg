<path d="M192,72 C250,96 300,124 334,150" stroke="#3a7ca5" stroke-width="3" fill="none"/>
<text x="250" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a7ca5">Air in the lungs</text>
<text x="265.0" y="176" text-anchor="middle" font-size="11" font-weight="400" fill="#9d97a6">Through the phrase →</text>
<text x="180" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">Support: the ribs stay wide while the voice sings,</text>
<text x="180" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">so the air is let out slowly</text>
