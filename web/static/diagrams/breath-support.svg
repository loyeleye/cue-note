<path d="M38,92 Q90,106 142,92" stroke="#2d2a32" stroke-width="1.2" fill="none" opacity="0.5"/>
<path d="M38,114 Q90,128 142,114" stroke="#2d2a32" stroke-width="1.2" fill="none" opacity="0.5"/>
<path d="M30,100 L12,100" stroke="#c8553d" stroke-width="2" fill="none" marker-end="url(#aA)"/>
<path d="M150,100 L168,100" stroke="#c8553d" stroke-width="2" fill="none" marker-end="url(#aA)"/>
<text x="90" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8553d">Ribs stay open</text>
<path d="M90,34 C90,22 110,16 130,16" stroke="#3a7ca5" stroke-width="1.5" fill="none" marker-end="url(#aB)"/>
<text x="136" y="20" text-anchor="start" font-size="11" font-weight="400" fill="#3a7ca5">a slow, steady stream</text>
