<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Onset from above">
<title>Onset from above</title>
<defs>
<marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7ca5"/></marker>
<marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2a32"/></marker>
</defs>
<rect width="360" height="240" rx="10" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2d2a32" stroke-linecap="round" stroke-linejoin="round">
<path d="M180,22 L180,218" stroke="#9d97a6" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<path d="M20,104 L160,104" stroke="#3a7ca5" stroke-width="1" fill="none" stroke-dasharray="5 4"/>
<text x="160" y="96" text-anchor="end" font-size="10.5" font-weight="400" fill="#3a7ca5">the note</text>
<path d="M26,150 C50,146 56,104 76,104 L154,104" stroke="#2d2a32" stroke-width="2.4" fill="none"/>
<text x="30" y="168" text-anchor="start" font-size="10.5" font-weight="400" fill="#c8553d">flat at first</text>
<text x="90" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">From below</text>
<text x="90" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#2d2a32">a scoop up to the note</text>
<path d="M200,104 L340,104" stroke="#3a7ca5" stroke-width="1" fill="none" stroke-dasharray="5 4"/>
<text x="340" y="96" text-anchor="end" font-size="10.5" font-weight="400" fill="#3a7ca5">the note</text>
<path d="M206,52 L206,70" stroke="#c8553d" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
<path d="M206,76 C226,80 234,104 250,104 L334,104" stroke="#2d2a32" stroke-width="2.4" fill="none"/>
<text x="270" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">From above</text>
<text x="270" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#2d2a32">aim high, land on the note</text>
<text x="8" y="26" text-anchor="start" font-size="10.5" font-weight="400" fill="#9d97a6">Pitch over time, at the start of a note</text>
