<ellipse cx="112" cy="100" rx="12" ry="15" stroke="#2d2a32" stroke-width="1.4" fill="#2d2a32"/>
<text x="112" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#2d2a32">O</text>
<ellipse cx="180" cy="100" rx="25" ry="30" stroke="#2d2a32" stroke-width="2" fill="#f7e2da"/>
