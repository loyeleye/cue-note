<text x="180" y="40" text-anchor="middle" font-size="11" font-weight="400" fill="#9d97a6">Lips from the front, one small step at a time</text>
<text x="180" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">Each vowel lives right next door to the last</text>
