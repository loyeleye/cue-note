<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Steady air on a long phrase">
<title>Steady air on a long phrase</title>
<defs>
<marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7ca5"/></marker>
<marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2a32"/></marker>
</defs>
<rect width="360" height="240" rx="10" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2d2a32" stroke-linecap="round" stroke-linejoin="round">
<path d="M56,36 L56,170 L330,170" stroke="#2d2a32" stroke-width="1.4" fill="none"/>
<text x="48" y="42" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">Full</text>
<text x="48" y="170" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">Empty</text>
<path d="M56,44 L320,158" stroke="#3a7ca5" stroke-width="3" fill="none"/>
<text x="196" y="82" text-anchor="start" font-size="12" font-weight="600" fill="#3a7ca5">Spread across the phrase</text>
<path d="M56,44 C116,116 166,164 206,166 L320,166" stroke="#c8553d" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
<text x="96" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#c8553d">Runs out early</text>
<path d="M320,36 L320,170" stroke="#9d97a6" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
<text x="320" y="30" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">end of phrase</text>
<rect x="56" y="186" width="264" height="16" rx="8" fill="#ece8f1"/>
<text x="188.0" y="198" text-anchor="middle" font-size="11" font-weight="400" fill="#2d2a32">one long sung phrase</text>
<text x="48" y="104" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">Air</text>
<text x="48" y="118" text-anchor="end" font-size="11" font-weight="400" fill="#9d97a6">left</text>
<text x="180" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d2a32">Plan the air for the whole phrase</text>
</g>
</svg>
